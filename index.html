<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            margin: 0%;
            text-align: center;
        }
        #container{
            background-color: rgb(200, 200, 199);
        }
        button{
            border-radius: 5px;
            text-align: center;
           cursor: pointer;
           padding: 8px 15px;
        }
        input{
            background: white;
            padding: 10px;
            width: 200px;
            border-radius: 8px;
        }
        
    </style>
</head>
<body>
    <div id="container">
        <h1>Login Details</h1>
        <label for="">Name:-</label>
        <input type="text " placeholder="Enter your Name" id="name"><br><br>
        <label for="">Email ID:-</label>
        <input type="email" placeholder="@Mail.com"><br><br>
        <label for="">Password:-</label>
        <input type="password" id="numbers"><br><br>
        <button onclick="login()">Submit</button>
        <p id="message"></p>
    </div>
    <script>
        function login(){
            let username=document.getElementById("name").value;
            let password=document.getElementById("numbers").value;

            fetch("http://127.0.0.1:5000/login",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                   username,password 
                })
            })
            .then(res=>res.json())
            .then(data=>{
                document.getElementById("message").innerText=data.message;
            })
        }

    </script>
</body>
</html>
